[project]
name = "madeye-intelligence"
version = "0.1.0"
description = "MAD-EYE document intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.17,<1",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<12",
  "pymupdf>=1.25,<2",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "onnxruntime>=1.20,<2",
  "prometheus-client>=0.21,<1",
  "regex>=2024.11.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "core",
  "services",
  "models",
  "pipelines",
  "runtime",
]
