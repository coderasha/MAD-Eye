services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: madeye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madeye-dev-only}
      POSTGRES_DB: madeye
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-madeye-app-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madeye -d madeye"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: madeye
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-madeye-dev-only}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-madeye}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-madeye-dev-only-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done &&
      mc mb --ignore-existing local/madeye &&
      mc anonymous set none local/madeye
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-madeye}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-madeye-dev-only-secret}

  intelligence:
    build:
      context: .
      dockerfile: infrastructure/docker/intelligence/Dockerfile
    environment:
      PYTHONPATH: /app/intelligence
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL_MIGRATE: postgresql://madeye:${POSTGRES_PASSWORD:-madeye-dev-only}@postgres:5432/madeye
      DATABASE_URL: postgresql://madeye_app:${APP_DB_PASSWORD:-madeye-app-dev-only}@postgres:5432/madeye
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://madeye_app:${APP_DB_PASSWORD:-madeye-app-dev-only}@postgres:5432/madeye
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://madeye:${RABBITMQ_PASSWORD:-madeye-dev-only}@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-madeye}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-madeye-dev-only-secret}
      S3_BUCKET: madeye
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-not-for-production-use}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-not-for-production-use}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      CORS_ORIGIN: http://localhost:3000
      INTELLIGENCE_BASE_URL: http://intelligence:8000
      COOKIE_SECURE: "false"
      ENABLE_API_DOCS: "true"
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      intelligence:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://madeye_app:${APP_DB_PASSWORD:-madeye-app-dev-only}@postgres:5432/madeye
      RABBITMQ_URL: amqp://madeye:${RABBITMQ_PASSWORD:-madeye-dev-only}@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-madeye}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-madeye-dev-only-secret}
      S3_BUCKET: madeye
      INTELLIGENCE_BASE_URL: http://intelligence:8000
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  minio-data:
