[project]
name = "madeye-model-factory"
version = "0.1.0"
description = "MAD-EYE model training and evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<12",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "hydra-core>=1.3,<2",
  "regex>=2024.11.6",
  "torch>=2.5,<3",
  "onnx>=1.17,<2",
  "mlflow>=2.18,<4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training", "evaluation"]
