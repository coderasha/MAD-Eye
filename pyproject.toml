[project]
name = "mad-eye"
version = "0.1.0"
description = "MAD-EYE proprietary OCR and document intelligence platform"
requires-python = ">=3.11"
readme = "README.md"
license = "LicenseRef-UNLICENSED"

[tool.uv.workspace]
members = ["intelligence", "model-factory"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["intelligence/tests", "model-factory/tests"]
pythonpath = ["intelligence", "model-factory"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
